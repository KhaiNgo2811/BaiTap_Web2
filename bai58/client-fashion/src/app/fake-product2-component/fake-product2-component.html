<p>{{ errMessage() }}</p>
<h3 class="text-center text-white bg-dark p-3">Product List</h3>
<div class="container">
  <div class="row">
    @for (p of products(); track p.id) {
      <div class="col-md-4 mb-4">
        <div class="card h-100 position-relative">
          <span class="badge bg-warning text-dark position-absolute m-2">-25%</span>
          <img [src]="p.image" class="card-img-top p-3" style="height: 220px; object-fit: contain;" [alt]="p.title">
          <div class="card-body d-flex flex-column">
            <h6 class="card-title text-truncate" [title]="p.title">{{ p.title }}</h6>
            <p class="text-danger fw-bold mb-1">${{ p.price }}</p>
            <div class="d-flex justify-content-between text-muted small mb-3">
              <span>{{ p.rating.rate }}</span>
              <span>Count: {{ p.rating.count }}</span>
            </div>
            <button class="btn btn-warning w-100 mt-auto">Buy Now</button>
          </div>
        </div>
      </div>
    } @empty {
      <p class="text-center">No products available.</p>
    }
  </div>
</div>

{{errMessage()}}
<table border="1">
    <tr>
        <td>Id</td>
        <td>Fashion Subject</td>
        <td>Fashion Detail</td>
        <td>Image</td>
    </tr>
    <tbody>
      @for (fashion of fashions();track fashion.Id)
      {
        <tr>
            <td>{{fashion.Id}}</td>
            <td>{{fashion.fashion_subject}}</td>
            <td>{{fashion.fashion_detail}} </td>
            <td>
                <img src="{{fashion.Image}}" width="100px" height="100px">
            </td>
        </tr>
      }
    </tbody>
</table>

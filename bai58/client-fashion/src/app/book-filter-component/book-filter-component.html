<p>{{ errMessage() }}</p>
Min: <input type="number" #min value="0">
Max: <input type="number" #max value="1000">
<button (click)="filter(min.value, max.value)">Filter</button>
<table border="1">
  <tr><td>BookId</td><td>BookName</td><td>Price</td><td>Image</td></tr>
  <tbody>
    @for (book of books(); track book.BookId) {
      <tr>
        <td>{{ book.BookId }}</td>
        <td>{{ book.BookName }}</td>
        <td>{{ book.Price }}</td>
        <td><img [src]="server_images_link + book.Image" width="50" height="50"></td>
      </tr>
    } @empty {
      <tr><td colspan="4">Not found books</td></tr>
    }
  </tbody>
</table>

<table border="1">
    <tr>
        <td colspan="2">Phương trình bậc 1</td>
    </tr>
    <tr>
        <td>Hệ số a:</td>
        <td>
            <input type="number" [(ngModel)]="hsa" #view_a />
        </td>
    </tr>
    <tr>
        <td>Hệ số b:</td>
        <td>
            <input type="number" value="{{ hsb }}" [(ngModel)]="hsb" #view_b/>
        </td>
    </tr>
    <tr>
        <td>Kết quả:</td>
        <td>
            <input type="text" [value]="result" readonly />
        </td>
    </tr>
    <tr>
        <td colspan="2">
            <button (click)="giaiPtb1(view_a.value, view_b.value)">Giải phương trình</button>
            <button (click)="ptMoi()">PT Mới</button>
        </td>
    </tr>
</table>

<p>product-list-advanced-component works!</p>
<p class="error">{{ errorMessage() }}</p>
<table border="1">
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Price</th>
      <th>Details</th>
      <th>Slug</th>
    </tr>
  </thead>
  <tbody>
    @for (product of products(); track product.id) {
      <tr>
        <td>{{ product.id }}</td>
        <td>{{ product.name }}</td>
        <td>{{ product.price }}</td>
        <td><button (click)="viewDetails(product.id)">Xem chi tiết</button></td>
        <td>
          <a (click)="viewDetailSlug(product)"
             style="cursor: pointer;"
             title="click here to view detail">
            {{ generateSlug(product.name, product.id) }}
          </a>
        </td>
      </tr>
    } @empty {
      <tr>
        <td colspan="5">Không có sản phẩm nào</td>
      </tr>
    }
  </tbody>
</table>
<router-outlet></router-outlet>

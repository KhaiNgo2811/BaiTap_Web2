<p>product-http-handle-error-service-component works!</p>
<pre>{{errMessage()}}</pre>
<table border="1">
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Price</th>
    </tr>
 </thead>
 <tbody>
    @for (product of products(); track product.id) {
        <tr>
            <td>{{ product.id }}</td>
            <td>{{ product.name }}</td>
            <td>{{ product.price }}</td>
        </tr>
    } @empty {
        <tr>
            <td colspan="3">Không có sản phẩm nào</td>
        </tr>
    }
</tbody>
</table>
